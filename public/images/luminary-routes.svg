<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 788" width="408" height="788" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img"><title>Wireframe: route options with accessibility toggles</title><rect x="0" y="0" width="408" height="788" rx="0" fill="#EEF0F3" stroke="none" stroke-width="1.5"/><g transform="translate(24 24)"><rect x="0" y="0" width="360" height="740" rx="40" fill="#FFFFFF" stroke="#23272E" stroke-width="3"/><rect x="130" y="14" width="100" height="22" rx="11" fill="#23272E" stroke="none" stroke-width="1.5"/><text x="28" y="32" font-size="13" font-weight="600" fill="#23272E" text-anchor="start">9:41</text><g><text x="20" y="84" font-size="24" font-weight="700" fill="#23272E" text-anchor="start">Route options</text><rect x="20" y="104" width="320" height="48" rx="10" fill="#F1F3F5" stroke="#A9AFB8" stroke-width="1"/><text x="36" y="133" font-size="15" font-weight="500" fill="#5B616B" text-anchor="start">To: Science Library</text><rect x="20" y="176" width="320" height="64" rx="12" fill="#F1F3F5" stroke="#A9AFB8" stroke-width="1"/><text x="36" y="204" font-size="16" font-weight="600" fill="#23272E" text-anchor="start">Wheelchair accessible</text><text x="36" y="224" font-size="13" font-weight="400" fill="#5B616B" text-anchor="start">Step-free paths only</text><rect x="278" y="196" width="48" height="26" rx="13" fill="#23272E" stroke="none" stroke-width="1"/><circle cx="313" cy="209" r="10" fill="#FFFFFF"/><rect x="20" y="252" width="320" height="64" rx="12" fill="#F1F3F5" stroke="#A9AFB8" stroke-width="1"/><text x="36" y="280" font-size="16" font-weight="600" fill="#23272E" text-anchor="start">Avoid steep slopes</text><text x="36" y="300" font-size="13" font-weight="400" fill="#5B616B" text-anchor="start">Skip inclines over 5%</text><rect x="278" y="272" width="48" height="26" rx="13" fill="#23272E" stroke="none" stroke-width="1"/><circle cx="313" cy="285" r="10" fill="#FFFFFF"/><rect x="20" y="328" width="320"